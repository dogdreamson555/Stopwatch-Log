name: stopwatch_log
description: "A Flutter desktop stopwatch log app with points, reviews, floating mode, and local SQLite storage."
publish_to: 'none'
version: 1.1.0-beta.2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  uuid: ^4.3.3
  intl: ^0.20.2
  window_manager: ^0.5.1
  drift: ^2.25.1
  sqlite3_flutter_libs: ^0.5.30
  path_provider: ^2.1.5
  path: ^1.9.1
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.25.1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
