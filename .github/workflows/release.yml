name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching pubspec.yaml, for example v1.1.0-beta.1'
        required: true
        type: string
      overwrite_existing:
        description: 'Replace the asset and notes if this GitHub Release already exists'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows release package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Resolve release tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TARGET_SHA: ${{ github.sha }}
          OVERWRITE_INPUT: ${{ inputs.overwrite_existing }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $tag = $env:INPUT_TAG
          } else {
            $tag = $env:REF_NAME
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Error "A release tag is required."
            exit 1
          }

          $tag = $tag.Trim()
          $semverTagPattern = '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
          if ($tag -notmatch $semverTagPattern) {
            Write-Error "Release tag must be a semantic version such as v1.1.0 or v1.1.0-beta.1. Got '$tag'."
            exit 1
          }

          $overwriteExisting = $env:OVERWRITE_INPUT -eq "true"
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          echo "RELEASE_TARGET=$env:RELEASE_TARGET_SHA" >> $env:GITHUB_ENV
          echo "OVERWRITE_EXISTING=$($overwriteExisting.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release version
        shell: pwsh
        run: |
          $versionLine = Get-Content "pubspec.yaml" | Where-Object { $_ -match '^version:\s*' } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($versionLine)) {
            Write-Error "pubspec.yaml does not contain a version field."
            exit 1
          }

          $appVersion = ($versionLine -replace '^version:\s*', '').Trim().Trim("'").Trim('"')
          $releaseVersion = $appVersion.Split('+')[0]
          if ($env:RELEASE_TAG -ne "v$releaseVersion") {
            Write-Error "Release tag $env:RELEASE_TAG does not match pubspec.yaml version $appVersion. Expected v$releaseVersion."
            exit 1
          }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build Windows
        run: flutter build windows --release --no-pub

      - name: Package Windows build
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $zip = "Stopwatch-Log-$env:RELEASE_TAG-windows-x64.zip"
          if (-not (Test-Path "$releaseDir/stopwatch_log.exe")) {
            Write-Error "Windows release executable was not found at $releaseDir/stopwatch_log.exe."
            exit 1
          }
          $guide = @"
          Stopwatch Log $env:RELEASE_TAG

          使用方法：
          1. 解压整个压缩包。
          2. 运行 stopwatch_log.exe。
          3. 不要单独移动 exe；data 文件夹和 DLL 文件需要和 exe 保持在同一目录。

          数据默认保存在：
          C:\Users\<用户名>\Documents\Stopwatch Log\stopwatch_log.db
          "@

          $guide | Out-File -FilePath "$releaseDir/README.txt" -Encoding utf8
          Compress-Archive -Path "$releaseDir/*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) {
            Write-Error "Windows release archive was not created at $zip."
            exit 1
          }
          echo "ZIP_NAME=$zip" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "$env:RELEASE_TAG"
          $asset = "$env:ZIP_NAME"
          $title = "Stopwatch Log $tag"
          $notes = @"
          Windows x64 版本。

          下载 $asset 后解压，运行 stopwatch_log.exe 即可使用。
          请保持 exe、data 文件夹和 DLL 文件在同一目录。
          "@

          if (-not (Test-Path $asset)) {
            Write-Error "Release asset was not found at $asset."
            exit 1
          }

          $releaseTagsJson = gh release list --limit 1000 --json tagName
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $releaseExists = @(($releaseTagsJson | ConvertFrom-Json) | Where-Object { $_.tagName -eq $tag }).Count -gt 0

          if ($releaseExists) {
            if ($env:OVERWRITE_EXISTING -ne "true") {
              Write-Error "GitHub Release $tag already exists. Run the workflow manually with overwrite_existing enabled only if replacing it is intentional."
              exit 1
            }

            gh release edit $tag --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            gh release upload $tag $asset --clobber
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          } else {
            gh release create $tag $asset --title $title --notes $notes --target "$env:RELEASE_TARGET"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
