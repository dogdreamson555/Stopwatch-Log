name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update from the selected ref, for example v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows release package
    runs-on: windows-latest

    steps:
      - name: Resolve release tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag) -or -not $tag.StartsWith("v")) {
            Write-Error "Release tag must start with v, for example v1.0.0. Got '$tag'."
            exit 1
          }
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          echo "RELEASE_TARGET=${{ github.sha }}" >> $env:GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows build
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $zip = "Stopwatch-Log-$env:RELEASE_TAG-windows-x64.zip"
          if (-not (Test-Path "$releaseDir/stopwatch_log.exe")) {
            Write-Error "Windows release executable was not found at $releaseDir/stopwatch_log.exe."
            exit 1
          }
          $guide = @"
          Stopwatch Log $env:RELEASE_TAG

          使用方法：
          1. 解压整个压缩包。
          2. 运行 stopwatch_log.exe。
          3. 不要单独移动 exe；data 文件夹和 DLL 文件需要和 exe 保持在同一目录。

          数据默认保存在：
          C:\Users\<用户名>\Documents\Stopwatch Log\stopwatch_log.db
          "@

          $guide | Out-File -FilePath "$releaseDir/README.txt" -Encoding utf8
          Compress-Archive -Path "$releaseDir/*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) {
            Write-Error "Windows release archive was not created at $zip."
            exit 1
          }
          echo "ZIP_NAME=$zip" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "$env:RELEASE_TAG"
          $asset = "$env:ZIP_NAME"
          $title = "Stopwatch Log $tag"
          $notes = @"
          Windows x64 版本。

          下载 $asset 后解压，运行 stopwatch_log.exe 即可使用。
          请保持 exe、data 文件夹和 DLL 文件在同一目录。
          "@

          if (-not (Test-Path $asset)) {
            Write-Error "Release asset was not found at $asset."
            exit 1
          }

          $releaseTagsJson = gh release list --limit 1000 --json tagName
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $releaseExists = @(($releaseTagsJson | ConvertFrom-Json) | Where-Object { $_.tagName -eq $tag }).Count -gt 0

          if ($releaseExists) {
            gh release edit $tag --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            gh release upload $tag $asset --clobber
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          } else {
            gh release create $tag $asset --title $title --notes $notes --target "$env:RELEASE_TARGET"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
